name: Bug report
description: Something in Dak does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dak version
      description: The output of `dak --version`
      placeholder: dak 0.1.2
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, Apple silicon
  - type: dropdown
    id: agent
    attributes:
      label: Which agent was involved?
      options: [None, Claude Code, Codex, Cursor, A remote agent, Something else]
  - type: textarea
    id: logs
    attributes:
      label: Anything useful from ~/.dak/app.log or the terminal
      render: text
