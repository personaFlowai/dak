<body>
<!--
THESIS: A Mac mail client for agent work. The agent's explanation and the conversation sit beside the thing under review; the category default (a web dashboard of cards, coloured avatars and pills) is refused.
OWN-WORLD: macOS source list, unified toolbar, system type (SF Pro, SF Mono), neutral greys, petrol (#1f6f8b) only for the primary action, selection and "waiting on you"; red only for danger. Tool logos in one ink colour. Hairlines, not cards.
STORY: The reader opens a PR, reads the agent's overview and chapters in order, comments on lines or words, asks the helper what he does not follow, sends a verdict that lands in the agent's session.
FIRST VIEWPORT: Sidebar left (Inbox, Sent, Agents, threads). Toolbar with the thread title. Conversation pane left, PR overview or document right.
FORM: brief-pinned (native macOS, petrol accent); no roll.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div id="app" class="app">
  <aside class="side" id="side" aria-label="Mailboxes and threads"></aside>
  <main class="main" id="main"></main>
</div>
<div id="selpop" hidden><button class="btn primary" data-selcomment>Comment</button><button class="btn" data-selask>Ask</button></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
